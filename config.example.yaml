# All relative paths are resolved from THIS file's directory.
timezone: Asia/Shanghai
schedule: "0 3 * * *" # Default: daily at 03:00, standard five-field cron.
quality: lossless
auto_downgrade: true # Retry lower native tiers only when the requested tier is explicitly unavailable.
run_on_start: false # No immediate API requests when starting the scheduler.

api:
  base_url: https://api.chksz.com
  key_env: CHKSZ_API_KEY # A valid environment key takes precedence over local YAML.
  # key: "YOUR_PERSONAL_CHKSZ_KEY" # Optional in your ignored local config.yaml.
  timeout: 30s
  min_interval: 3100ms # Do not reduce below the documented 20 requests/minute.

# Playlist/search/track metadata connect directly to the selected music platform.
metadata:
  timeout: 30s
  min_interval: 1s
  fallback_to_api: true # Only after native failure, and only for documented endpoints.
  netease_cookie_env: MELOPORT_NETEASE_COOKIE
  qq_cookie_env: MELOPORT_QQ_COOKIE
  kugou_cookie_env: MELOPORT_KUGOU_COOKIE

storage:
  database: data/meloport.db
  music_dir: data/music

download:
  timeout: 5m
  max_size_mb: 512

server:
  listen: "127.0.0.1:8080" # Local Web management and health checks. Set "" to disable.
  # Key-only Web login: set MELOPORT_ADMIN_PASSWORD (12-1024 bytes)
  # in the process environment before starting; a valid value overrides YAML.
  # Missing or invalid-length environment passwords fall back to admin_password.
  # For local development, set admin_password in your ignored config.yaml instead.
  # admin_password: "YOUR_LOCAL_TEST_PASSWORD"

# Optional publication through a CloudDrive2 mount, 115 verification and playback.
# Deployment settings below remain compatible with YAML; prefer the documented environment overrides.
# Restart after changes; Web QR login is held in process memory.
cloud115:
  enabled: false
  media_enabled: false
  navidrome_enabled: false
  navidrome_playlist_sync: false # Publish playlist/ranking subscriptions from local music or 115; no cloud requirement.
  client_id: "100197303" # MELOPORT_115_CLIENT_ID takes precedence.
  access_token_env: MELOPORT_115_ACCESS_TOKEN # Legacy token variable alias; never store the token here.
  # target_cid: "123456" # Dedicated non-root 115 target; select it after QR login.
  # mount_dir: "X:/115/Music" # Existing CloudDrive2 mount path corresponding to target_cid.
  # Local audio is retained. No extra staging directory or same-volume requirement.
  strm_dir: data/strm
  media_listen: "127.0.0.1:8081" # MELOPORT_MEDIA_LISTEN takes precedence.
  media_base_url: "http://127.0.0.1:8081" # Use the HTTPS address reachable by remote players.
  poll_interval: 1m # MELOPORT_115_POLL_INTERVAL takes precedence.
  timeout: 15s # MELOPORT_115_TIMEOUT takes precedence.
  # navidrome_url: "http://127.0.0.1:4533"
  # navidrome_mount_root: "/music" # storage.music_dir as seen by Navidrome; with 115, use its mounted target root.
  # navidrome_username: "meloport" # MELOPORT_NAVIDROME_USERNAME takes precedence.
  # navidrome_password_env: MELOPORT_NAVIDROME_PASSWORD # Legacy password variable alias; environment only.

tasks:
  - id: favorites
    platform: netease
    # Example ID; replace with your actual public/full-access playlist ID or URL.
    playlist: "3778678"
    # Omit schedule to inherit the global default.
    # schedule: "30 2 * * *"
    # Omit quality to inherit the global default.
    # quality: hires
    # directory is relative to storage.music_dir; defaults to the task ID.
    # directory: favorites
    enabled: true

  # - id: evening
  #   playlist: "https://music.163.com/#/playlist?id=YOUR_PLAYLIST_ID"
  #   schedule: "0 20 * * *"

  # QQ song IDs are string MIDs; the native playlist reader handles this.
  # - id: qq-favorites
  #   platform: qq
  #   playlist: "https://y.qq.com/n/ryqq/playlist/YOUR_PLAYLIST_ID"
  #   quality: flac
  #   schedule: "30 3 * * *"

  # Kugou numeric share codes, id_SPECIAL and supported official share links.
  # - id: kugou-favorites
  #   platform: kugou
  #   playlist: "id_YOUR_SPECIAL_ID"
  #   quality: flac
